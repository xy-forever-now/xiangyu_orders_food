<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>雨膳房</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- 左侧分类导航 -->
        <aside class="sidebar">
            <h1 class="logo">🍽️ 雨膳房</h1>
            <nav class="category-nav">
                <button class="category-btn active" data-category="饮品">
                    <span class="category-icon">🧋</span>
                    <span class="category-name">饮品</span>
                </button>
                <button class="category-btn" data-category="食品">
                    <span class="category-icon">🍔</span>
                    <span class="category-name">食品</span>
                </button>
                <button class="category-btn" data-category="互动">
                    <span class="category-icon">🎲</span>
                    <span class="category-name">互动</span>
                </button>
                <button class="category-btn" data-category="心情">
                    <span class="category-icon">🧸</span>
                    <span class="category-name">心情</span>
                </button>
                <button class="category-btn" data-category="甜品">
                    <span class="category-icon">🍰</span>
                    <span class="category-name">甜品</span>
                </button>
                <button class="category-btn" id="syncDataBtn" style="margin-top: auto; background: linear-gradient(135deg, #27ae60 0%, #2ecc71 100%);">
                    <span class="category-icon">🔄</span>
                    <span class="category-name">同步数据</span>
                </button>
                <button class="category-btn" id="orderHistoryBtn" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">
                    <span class="category-icon">📋</span>
                    <span class="category-name">历史订单</span>
                </button>
            </nav>
        </aside>

        <!-- 右侧内容区域 -->
        <main class="main-content">
            <!-- 顶部购物车 -->
            <header class="header">
                <h2 class="category-title">饮品</h2>
                <button class="cart-btn" id="cartBtn">
                    <span class="cart-icon">🛒</span>
                    <span class="cart-count" id="cartCount">0</span>
                </button>
            </header>

            <!-- 商品展示区域 -->
            <div class="products-grid" id="productsGrid">
                <!-- 商品将通过JavaScript动态生成 -->
            </div>
        </main>
    </div>

    <!-- 购物车弹窗 -->
    <div class="cart-modal" id="cartModal">
        <div class="cart-content">
            <div class="cart-header">
                <h3>🛒 购物车</h3>
                <button class="close-btn" id="closeCart">✕</button>
            </div>
            <div class="cart-items" id="cartItems">
                <!-- 购物车商品将通过JavaScript动态生成 -->
            </div>
            <div class="cart-footer">
                <button class="checkout-btn" id="checkoutBtn">提交订单</button>
            </div>
        </div>
    </div>

    <!-- Supabase客户端库 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>
</body>
</html>
